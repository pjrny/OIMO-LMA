name: Deploy Cloudflare Worker Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker to Cloudflare
        working-directory: ./cloudflare-worker
        env:
          # NOTE: For the shared Cloudflare account the account ID is
          # 0adfeaaccd1d2cfa389d7bcd33b55ee4. Both secrets below MUST be
          # created in the GitHub repo settings (Settings -> Secrets and
          # variables -> Actions) and must NEVER be committed to the repo.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
